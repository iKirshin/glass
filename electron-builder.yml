# electron-builder.yml

# The unique application ID
appId: com.ikirshin.inpro

# The user-facing application name
productName: InPro

# Publish configuration for GitHub releases
publish:
    provider: github
    owner: iKirshin
    repo: glass
    releaseType: draft

# Protocols configuration for deep linking
protocols:
    name: InPro Protocol
    schemes: 
        - pickleglass

# Native modules (better-sqlite3 13, keytar, sharp) ship prebuilt N-API binaries that
# work in Electron as-is, so no rebuild against Electron headers is needed. This keeps
# `npm install` and packaging free of Python / MSVC / Xcode requirements.
npmRebuild: false

# List of files to be included in the app package
files:
    - src/**/*
    - package.json
    - pickleglass_web/backend_node/**/*
    - '!**/node_modules/electron/**'
    - public/build/**/*

# Additional resources to be copied into the app's resources directory
extraResources:
    - from: pickleglass_web/out
      to: out

asarUnpack:
    - "src/ui/assets/SystemAudioDump"
    - "**/node_modules/sharp/**/*"
    - "**/node_modules/@img/**/*"

# Windows configuration
win:
    icon: src/ui/assets/logo.ico
    target:
        - target: nsis
          arch: x64
        - target: portable
          arch: x64
    requestedExecutionLevel: asInvoker
    # Unsigned build by default. To sign, set CSC_LINK / CSC_KEY_PASSWORD env vars
    # (electron-builder picks them up automatically).
    signAndEditExecutable: false

# NSIS installer configuration for Windows
nsis:
    oneClick: false
    perMachine: false
    allowToChangeInstallationDirectory: true
    deleteAppDataOnUninstall: true
    createDesktopShortcut: always
    createStartMenuShortcut: true
    shortcutName: InPro

# macOS specific configuration
mac:
    # The application category type
    category: public.app-category.utilities
    # Path to the .icns icon file
    icon: src/ui/assets/logo.icns
    # Minimum macOS version (supports both Intel and Apple Silicon)
    minimumSystemVersion: '13.0'
    hardenedRuntime: true
    entitlements: entitlements.plist
    entitlementsInherit: entitlements.plist
    target:
      - target: dmg
        arch: universal
      - target: zip
        arch: universal
